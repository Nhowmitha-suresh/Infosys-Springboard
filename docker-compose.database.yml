services:
  postgres:
    image: postgres:17
    container_name: medisphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medisphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: medisphere
    ports:
      - "5433:5432"
    volumes:
      - medisphere-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medisphere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medisphere-postgres-data:
