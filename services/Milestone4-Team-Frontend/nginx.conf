server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) — always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Java (Spring Boot) backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Flask ML microservice. This container's frontend build sets
    # VITE_ML_API_URL=/ml (see ../Dockerfile + ../../docker-compose.yml
    # build args) so the browser hits this same-origin path -> this
    # proxy -> ml-service, rather than ml-service's own port directly.
    location /ml/ {
        proxy_pass http://ml-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Milestone 3: Node/Express monitoring-service (clinical rule engine +
    # notifications REST API). Same pattern as /ml/ above --
    # VITE_MONITORING_API_URL=/monitoring is baked in by default.
    location /monitoring/ {
        proxy_pass http://monitoring-service:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Milestone 3: Socket.IO realtime notifications. Needs the WebSocket
    # upgrade headers -- plain HTTP proxying (like the locations above)
    # isn't enough for a persistent connection.
    location /socket.io/ {
        proxy_pass http://monitoring-service:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
