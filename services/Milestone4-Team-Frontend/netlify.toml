# Netlify configuration for the MediSphere frontend.
# SPA fallback: serve index.html for client-side routes (not /api or /ws).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Netlify evaluates redirects in order; these conditions exclude API/WS.
  conditions = { Path = [ "!^/api/", "!^/ws/" ] }

# For a split deployment, set VITE_API_BASE_URL to your deployed backend:
#   [build.environment]
#     VITE_API_BASE_URL = "https://medisphere-backend.up.railway.app/api"
#     VITE_USE_MOCK_DATA = "false"
