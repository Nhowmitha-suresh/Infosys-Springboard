# Railway configuration for the MediSphere backend.
# Deploy the `backend/` directory on Railway. Railway auto-detects the
# Dockerfile at the deployed root. Set env vars in the Railway dashboard
# (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS).

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "java -jar target/backend-0.1.0.jar"
  healthcheckPath = "/actuator/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[deploy.metrics]
  port = 8080
  path = "/actuator/health"
