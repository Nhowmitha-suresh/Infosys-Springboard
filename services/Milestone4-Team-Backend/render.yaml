# Render blueprint for the MediSphere backend.
# Deploy the `backend/` directory on Render as a Web Service.
# Render auto-detects this blueprint (render.yaml) when you "New +" -> "Blueprint".
services:
  - type: web
    name: medisphere-backend
    runtime: docker
    repo: https://github.com/YOUR_USER/YOUR_REPO # replace with your repo
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://YOUR_POSTGRES_HOST:5432/medisphere
        sync: false
      - key: DB_USERNAME
        value: postgres
        sync: false
      - key: DB_PASSWORD
        value: yourpassword
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
        sync: false
      - key: SQL_INIT_MODE
        value: always
      - key: DDL_AUTO
        value: update
