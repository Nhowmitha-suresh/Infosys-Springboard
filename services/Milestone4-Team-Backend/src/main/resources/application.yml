server:
  port: ${PORT:8080}

spring:
  application:
    name: medisphere-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/medisphere?TimeZone=Asia/Kolkata}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:medisphere}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' so your teammate's schema evolves automatically in dev.
      # Switch to 'validate' once the schema is stable / in production.
      ddl-auto: ${DDL_AUTO:update}
    # Run Hibernate's schema creation BEFORE data.sql, otherwise the seed
    # inserts fail because the tables don't exist yet.
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: medisphere-vitals-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.medisphere.backend.dto"
        spring.json.value.default.type: com.medisphere.backend.dto.VitalsReading
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # If Kafka isn't reachable (e.g. you haven't started `docker compose up` yet),
    # the app still starts — vitals just won't stream until Kafka is up.
    listener:
      missing-topics-fatal: false

app:
  jwt:
    # 32+ char secret. Override with a real secret via JWT_SECRET env var in any real deployment.
    secret: ${JWT_SECRET:change-this-super-secret-key-before-deploying-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  cors:
    # Comma-separated list of allowed frontend origins, e.g. your Vercel/Netlify URL.
    # "*" works with allowCredentials(true) because SecurityConfig uses
    # allowedOriginPatterns. Override via CORS_ALLOWED_ORIGINS to restrict.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  kafka:
    vitals-topic: ${KAFKA_VITALS_TOPIC:vitals.raw}
    vitals-topic-partitions: ${KAFKA_VITALS_TOPIC_PARTITIONS:3}
